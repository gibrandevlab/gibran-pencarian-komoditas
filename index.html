<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Master Komoditas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title">Master Komoditas</h1>

  <!-- Tampilan 1: daftar komoditas (komoditas.json) -->
  <section class="panel" id="p-komoditas" aria-label="Daftar komoditas">
    <div class="bar">
      <div class="inner">
        <div class="search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 0 3.47 9.77l3.63 3.63a.75.75 0 1 0 1.06-1.06l-3.63-3.63A5.5 5.5 0 0 0 8.5 3ZM4.5 8.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0Z" fill="currentColor"/></svg>
          <input type="search" placeholder="Cari nama atau kode komoditas…" aria-label="Cari nama atau kode komoditas" autocomplete="off" spellcheck="false" />
          <button type="button" class="clear" aria-label="Hapus pencarian" hidden>&times;</button>
        </div>
        <div class="seg" style="--n:3;--i:0" role="group" aria-label="Filter kategori">
          <i class="thumb"></i>
          <button type="button" aria-pressed="true" data-v="Semua">Semua</button>
          <button type="button" aria-pressed="false" data-v="Makanan">Makanan</button>
          <button type="button" aria-pressed="false" data-v="Non Makanan">Non Makanan</button>
        </div>
      </div>
    </div>
    <p class="status" role="status">Memuat komoditas…</p>
    <div class="card">
      <div class="thead a"><span>No</span><span>Kode</span><span>Nama komoditas</span><span>Kategori</span></div>
      <ul class="list"></ul>
      <div class="empty" hidden><b></b><p>Coba kata kunci atau kode lain.</p></div>
    </div>
  </section>

  <!-- Tampilan 2: kualitas per komoditas (Master_Komoditas_SPKRT_2027.json) -->
  <section class="panel" id="p-kualitas" aria-label="Kualitas komoditas" hidden>
    <div class="bar">
      <div class="inner">
        <div class="search">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 0 3.47 9.77l3.63 3.63a.75.75 0 1 0 1.06-1.06l-3.63-3.63A5.5 5.5 0 0 0 8.5 3ZM4.5 8.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0Z" fill="currentColor"/></svg>
          <input type="search" placeholder="Cari komoditas, kualitas, atau kode…" aria-label="Cari komoditas, kualitas, atau kode" autocomplete="off" spellcheck="false" />
          <button type="button" class="clear" aria-label="Hapus pencarian" hidden>&times;</button>
        </div>
      </div>
    </div>
    <p class="status" role="status">Memuat kualitas…</p>
    <div class="card">
      <div class="thead b"><span>Kode kual.</span><span>Nama kualitas</span><span>Kode lengkap</span></div>
      <ul class="list"></ul>
      <div class="empty" hidden><b></b><p>Coba kata kunci atau kode lain.</p></div>
    </div>
  </section>

  <nav class="dock seg" id="dock" style="--n:2;--i:0" aria-label="Pilih tampilan">
    <i class="thumb"></i>
    <button type="button" aria-pressed="true" data-v="komoditas">Komoditas</button>
    <button type="button" aria-pressed="false" data-v="kualitas">Kualitas</button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
